[project]
name = "molcajete-prep"
version = "0.1.0"
description = "Molcajete prep pipeline: DRM-free EPUB to a schemaVersion 1 bundle."
readme = "README.md"

# spaCy 3.8 ships no cp314 wheels, so 3.14 would compile spacy/thinc/blis from
# source. Pin below it.
requires-python = ">=3.11,<3.14"

dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "spacy>=3.8,<3.9",
    "wordfreq>=3.1",
    "es-core-news-sm",
]

[project.scripts]
molcajete-build-bundle = "molcajete_prep.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

# The spaCy models are not on PyPI; they are released as wheels on GitHub.
[tool.uv.sources]
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["molcajete_prep"]
